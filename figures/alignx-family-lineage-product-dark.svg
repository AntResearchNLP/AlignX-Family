<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="AlignX-Family product-style lineage: DATA to REASONING to INTERFACE (dark)">
  <defs>
    <style>
      .title { font: 800 22px/1.2 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0.2px; }
      .subtitle { font: 500 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #94A3B8; }
      .tag { font: 800 11px/1 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #E2E8F0; letter-spacing: 1px; }
      .name { font: 800 18px/1.2 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .k { font: 650 12px/1.25 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .p { font: 500 12px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #94A3B8; }
      .mini { font: 600 11px/1.2 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; fill: #94A3B8; }
      .card { fill: #071021; stroke: #1E293B; stroke-width: 1.2; }
      .shadow { filter: drop-shadow(0 16px 34px rgba(0,0,0,0.45)); }
      .arrow { stroke: #64748B; stroke-width: 2.2; fill: none; }
      .arrowHead { fill: #64748B; }
      .pill1 { fill: rgba(99,102,241,0.16); stroke: rgba(99,102,241,0.42); }
      .pill2 { fill: rgba(16,185,129,0.16); stroke: rgba(16,185,129,0.42); }
      .pill3 { fill: rgba(249,115,22,0.16); stroke: rgba(249,115,22,0.42); }
      .tagBg1 { fill: rgba(99,102,241,0.24); }
      .tagBg2 { fill: rgba(16,185,129,0.24); }
      .tagBg3 { fill: rgba(249,115,22,0.24); }
      .sep { stroke: #1E293B; stroke-width: 1; }
      .iconStrokeMuted { stroke: #E2E8F0; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.90; }
      .ctaBg { fill: rgba(148,163,184,0.12); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="280" fill="#030712"/>

  <text x="40" y="44" class="title">AlignX-Family Lineage</text>
  <text x="40" y="68" class="subtitle">Build the stack: <tspan font-weight="800">DATA</tspan> → <tspan font-weight="800">REASONING</tspan> → <tspan font-weight="800">INTERFACE</tspan> for scalable LLM personalization</text>

  <g>
    <rect x="40" y="84" width="210" height="26" rx="13" class="ctaBg"/>
    <text x="54" y="102" class="mini">Foundation → Transfer → Productization</text>
  </g>

  <g class="shadow">
    <rect x="40" y="120" width="330" height="140" rx="18" class="card"/>
  </g>
  <g>
    <rect x="64" y="138" width="78" height="22" rx="11" class="tagBg1"/>
    <text x="103" y="154" text-anchor="middle" class="tag">DATA</text>

    <g transform="translate(282,138)">
      <ellipse cx="18" cy="8" rx="14" ry="5" class="iconStrokeMuted"/>
      <path d="M4,8 v16 c0,3 6,5 14,5 s14-2 14-5 v-16" class="iconStrokeMuted"/>
      <path d="M4,16 c0,3 6,5 14,5 s14-2 14-5" class="iconStrokeMuted"/>
      <path d="M4,24 c0,3 6,5 14,5 s14-2 14-5" class="iconStrokeMuted"/>
    </g>

    <rect x="64" y="170" width="122" height="30" rx="15" class="pill1" stroke-width="1.2"/>
    <text x="125" y="190" text-anchor="middle" class="name">AlignX</text>

    <line x1="64" y1="208" x2="346" y2="208" class="sep"/>

    <text x="64" y="228" class="k">Ship with confidence</text>
    <text x="64" y="246" class="p">Largest open, privacy-preserving dataset</text>
    <text x="64" y="262" class="p">to bootstrap personalized alignment.</text>
  </g>

  <g class="shadow">
    <rect x="435" y="120" width="330" height="140" rx="18" class="card"/>
  </g>
  <g>
    <rect x="459" y="138" width="118" height="22" rx="11" class="tagBg2"/>
    <text x="518" y="154" text-anchor="middle" class="tag">REASONING</text>

    <g transform="translate(677,138)">
      <path d="M8,20 c-3,-8 2,-16 10,-16 c3,0 5,1 7,3 c2,-2 4,-3 7,-3 c8,0 13,8 10,16 c-2,7 -8,10 -17,10 c-9,0 -15,-3 -17,-10 Z" class="iconStrokeMuted"/>
      <circle cx="18" cy="15" r="2" class="iconStrokeMuted"/>
      <circle cx="28" cy="15" r="2" class="iconStrokeMuted"/>
      <path d="M20,19 L26,23" class="iconStrokeMuted"/>
      <path d="M26,19 L20,23" class="iconStrokeMuted"/>
    </g>

    <rect x="459" y="170" width="170" height="30" rx="15" class="pill2" stroke-width="1.2"/>
    <text x="544" y="190" text-anchor="middle" class="name">AlignXplore</text>

    <line x1="459" y1="208" x2="741" y2="208" class="sep"/>

    <text x="459" y="228" class="k">Turn signals into preferences</text>
    <text x="459" y="246" class="p">Deep reasoning over complex behavioral traces</text>
    <text x="459" y="262" class="p">with dynamic, streaming updates.</text>
  </g>

  <g class="shadow">
    <rect x="830" y="120" width="330" height="140" rx="18" class="card"/>
  </g>
  <g>
    <rect x="854" y="138" width="116" height="22" rx="11" class="tagBg3"/>
    <text x="912" y="154" text-anchor="middle" class="tag">INTERFACE</text>

    <g transform="translate(1072,138)">
      <path d="M6,8 h24 a6,6 0 0 1 6,6 v8 a6,6 0 0 1 -6,6 h-10 l-6,6 v-6 h-8 a6,6 0 0 1 -6,-6 v-8 a6,6 0 0 1 6,-6 Z" class="iconStrokeMuted"/>
      <path d="M12,18 h14" class="iconStrokeMuted"/>
      <path d="M12,23 h10" class="iconStrokeMuted"/>
    </g>

    <rect x="854" y="170" width="190" height="30" rx="15" class="pill3" stroke-width="1.2"/>
    <text x="949" y="190" text-anchor="middle" class="name">AlignXplore+</text>

    <line x1="854" y1="208" x2="1136" y2="208" class="sep"/>

    <text x="854" y="228" class="k">Plug-and-play personalization</text>
    <text x="854" y="246" class="p">Natural-language preference interface for</text>
    <text x="854" y="262" class="p">cross-task, cross-model transfer.</text>
  </g>

  <path d="M 370 190 C 405 190, 405 190, 430 190" class="arrow"/>
  <polygon points="430,190 418,183 418,197" class="arrowHead"/>
  <path d="M 765 190 C 800 190, 800 190, 825 190" class="arrow"/>
  <polygon points="825,190 813,183 813,197" class="arrowHead"/>

</svg>
